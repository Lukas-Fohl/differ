[package]
name = "differ"
version = "0.1.0"
edition = "2024"
description = "A minimal read-only desktop Git diff viewer"

[dependencies]
bevy = { version = "=0.17.3", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_log", "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_window", "bevy_asset", "bevy_image", "bevy_camera", "bevy_color", "bevy_shader", "x11", "wayland", "default_font"] }
bevy_egui = { version = "=0.38.0", default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }
